name: Scheduled Portal Scrape

on:
  repository_dispatch:
    types: [trigger-scrape]
  schedule:
    # Runs at IST 08:30, 13:30, 18:30, 21:30 (= UTC 03:00, 08:00, 13:00, 16:00)
    - cron: '0 3 * * 1-6'   # 08:30 IST  Mon–Sat (morning sync)
    - cron: '0 8 * * 1-6'   # 13:30 IST  Mon–Sat (afternoon sync)
    - cron: '0 13 * * 1-6'  # 18:30 IST  Mon–Sat (evening sync — MAIN daily scrape)
    - cron: '0 16 * * 1-6'  # 21:30 IST  Mon–Sat (night confirmation)
  workflow_dispatch:         # Manual trigger from GitHub Actions tab
    inputs:
      force:
        description: 'Force scrape all sections'
        required: false
        default: 'true'

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_scraper.txt

      - name: Run Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          PORTAL_BASE_URL: ${{ secrets.PORTAL_BASE_URL }}
          FORCE_SCRAPE: ${{ github.event_name != 'schedule' }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          HTTP_PROXY: ${{ secrets.PROXY_URL }}
          HTTPS_PROXY: ${{ secrets.PROXY_URL }}
          NO_PROXY: localhost,127.0.0.1,supabase.co,pooler.supabase.com
        run: python run_scrape.py

