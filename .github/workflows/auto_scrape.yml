name: Scheduled Portal Scrape

on:
  schedule:
    # Runs twice daily (shifted to off-peak minutes to avoid GitHub queue delays):
    # - 02:25 UTC = 07:55 AM IST (Morning Sync)
    # - 12:25 UTC = 05:55 PM IST (Evening Sync)
    - cron: '25 2,12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_scraper.txt

      - name: Run Scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
        run: python run_scrape.py
